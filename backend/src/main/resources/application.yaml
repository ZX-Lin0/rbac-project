spring:
  application:
    name: RbacDemo
  datasource:
    url: jdbc:mysql://localhost:3306/rbac_demo?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  logging:
    file:
      name: logs/rbac-demo.log
    level:
      root: info
      com.example.rbacdemo: debug
  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: ${AI_API_KEY}
      chat:
        options:
          model: deepseek-flash
          temperature: 0.7

  mybatis-plus:
    global-config:
      db-config:
        logic-delete-field: isDeleted
        logic-delete-value: 1
        logic-not-delete-value: 0
